name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma Validate
        run: npm run prisma:validate

      - name: Prisma Generate
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (com cobertura)
        run: npm run test:coverage

      - name: Resumo de cobertura
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total; const p=(k)=>s[k].pct; console.log('- Cobertura: statements '+p('statements')+'%, branches '+p('branches')+'%, functions '+p('functions')+'%, lines '+p('lines')+'%')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Contract Test
        run: npm run test:contract

      - name: Build
        run: npm run build
